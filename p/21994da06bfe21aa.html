<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>第一幕 最終謎</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600;900&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: 一枚ずつ机に置いた「書類」を縦に並べる。答えは最後にまとめて折りたたむ */
:root{
  --bg:#eef1f4; --paper:#fbfcfd; --ink:#1d2a3a; --muted:#5b6878; --line:#cdd5de;
  --accent:#d9737a; --accent-soft:#f6dcdd; --sea:#2f4f72;
  --f-display:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121821; --paper:#1b2430; --ink:#e6ebf1; --muted:#9aa7b6; --line:#2f3b4a;
  --accent:#ee9aa0; --accent-soft:#3a2629; --sea:#8fb3dc; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121821; --paper:#1b2430; --ink:#e6ebf1; --muted:#9aa7b6; --line:#2f3b4a;
  --accent:#ee9aa0; --accent-soft:#3a2629; --sea:#8fb3dc; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.8;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 64px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,6vw,40px);line-height:1.25;margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:0}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:28px clamp(18px,4vw,36px);display:flex;flex-direction:column;gap:16px;min-width:0}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px}
.sheet-id{font-family:var(--f-mono);font-size:13px;letter-spacing:.15em;color:var(--accent)}
.sheet h2{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0;text-wrap:balance}
.sheet p{margin:0}
.letter{font-family:var(--f-display);font-size:18px;line-height:2.1;white-space:pre-line}
.letter .sign{display:block;text-align:right;margin-top:8px}
.clocks{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.clock{width:120px;max-width:28vw;height:auto}
.clock text{font-family:var(--f-body)}
.ex{display:flex;flex-direction:column;gap:6px;align-items:center}
.cap{font-size:12px;color:var(--muted);letter-spacing:.1em}
.boxes{display:flex;gap:6px;justify-content:center}
.boxes span{width:34px;height:34px;border:1.5px solid var(--ink);border-radius:2px}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.list div{border:1px solid var(--line);border-radius:2px;padding:12px;text-align:center;font-size:22px;font-weight:500}
.pieces{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;padding:12px 0}
.pieces span{font-size:44px;font-family:var(--f-display);line-height:1}
.pieces span:nth-child(1){transform:rotate(-8deg)} .pieces span:nth-child(2){transform:rotate(6deg) translateY(10px)}
.pieces span:nth-child(3){transform:rotate(-3deg) translateY(-6px)} .pieces span:nth-child(4){transform:rotate(9deg)}
.mono-big{font-family:var(--f-mono);font-size:clamp(26px,7vw,40px);letter-spacing:.2em;text-align:center;margin:0;overflow-wrap:anywhere}
.mono{font-family:var(--f-mono);font-size:24px;letter-spacing:.15em;text-align:center}
.pairs{display:flex;flex-direction:column;gap:8px;align-items:center;font-size:22px}
.pairs b{font-weight:500;color:var(--sea)}
.groups{display:flex;flex-direction:column;gap:10px}
.group{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.group span{border:1px solid var(--line);border-radius:2px;padding:10px 4px;text-align:center;font-size:18px}
@media (max-width:480px){.group{grid-template-columns:repeat(2,1fr)}}
.final{border:2px solid var(--accent)}
.code{font-family:var(--f-mono);font-size:clamp(24px,6vw,34px);letter-spacing:.12em;text-align:center;display:flex;flex-wrap:wrap;gap:8px 28px;justify-content:center}
.cards{display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
.card{display:flex;flex-direction:column;gap:6px;align-items:center}
.grid4{display:grid;grid-template-columns:repeat(4,44px);grid-template-rows:repeat(4,44px);border:1.5px solid var(--ink);background:var(--paper)}
.grid4 span{display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid var(--line)}
.mask span{background:var(--ink);border-color:var(--ink)}
.mask span.hole{background:var(--paper);border:1px dashed var(--muted)}
.strips{display:flex;flex-direction:column;gap:14px;align-items:center}
.strip{font-family:var(--f-mono);font-size:30px;letter-spacing:.6em;padding:6px 10px 6px 22px;border:1px solid var(--line);background:var(--paper)}
.strip:nth-child(1){transform:rotate(-2deg)} .strip:nth-child(2){transform:rotate(3deg) translateX(30px)}
.selfq{font-family:var(--f-display);font-weight:900;font-size:clamp(22px,5vw,30px);line-height:1.5;margin:0;text-wrap:balance}
.answers{background:var(--paper);border:1px dashed var(--accent);border-radius:4px;padding:20px clamp(18px,4vw,32px)}
.answers summary{cursor:pointer;font-weight:700;color:var(--accent)}
.answers summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.ans{border-top:1px solid var(--line);padding-top:14px;margin-top:14px;display:flex;flex-direction:column;gap:6px}
.ans h3{margin:0;font-size:16px}
.ans .a{font-size:20px;font-weight:700;color:var(--accent)}
.ans ol{margin:0;padding-left:1.3em;color:var(--muted)}
.ans p{margin:0}
.note{font-size:13px;color:var(--muted)}
.peek{border-top:1px dashed var(--line);padding-top:10px}
.peek summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.05em}
.peek summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.peek .ans{border-top:none;margin-top:8px;padding-top:0}
.ask{font-weight:700;color:var(--sea);margin:0}
</style><style>
body{padding-block:12px 24px}
.wrap{gap:20px}
</style></head><body><div class="wrap"><section class="sheet final">
